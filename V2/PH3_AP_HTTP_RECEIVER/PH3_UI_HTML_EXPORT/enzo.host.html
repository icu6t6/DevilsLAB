<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enzo Host – Phase 3</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            font-size: 24px;
            padding: 20px;
            margin: 10px;
            width: 120px;
        }
    </style>
</head>
<body>

    <h1>Enzo Host</h1>
    <p>Phase 3 – Manual Web Control (Proof)</p>

    <div>
        <button onclick="send('W')">W</button><br>
        <button onclick="send('A')">A</button>
        <button onclick="send('X')">STOP</button>
        <button onclick="send('D')">D</button><br>
        <button onclick="send('S')">S</button>
    </div>

    <pre id="log"></pre>

    <script>
        function send(cmd) {
            console.log("CMD:", cmd);
            document.getElementById("log").textContent += cmd + " ";
        }
    </script>

</body>
</html>
