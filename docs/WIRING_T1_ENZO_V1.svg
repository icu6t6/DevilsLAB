<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400">
<title>ENZO V1 Free — electrical connection reference</title>
<desc>Three external Schottky power paths, onboard USB diode, GPIO mapping and owner-confirmed LDR divider. Topology reference; component operating limits are specified separately.</desc>
<rect width="1120" height="1400" fill="#f4f6f8"/>
<text x="40" y="48" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="start">ENZO T1 V1 Free</text>
<text x="40" y="78" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Electrical connection reference · no motors or Pi required</text>
<rect x="30" y="100" width="1060" height="675" rx="10" fill="#ffffff" stroke="#c9d2dd"/>
<text x="50" y="132" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">POWER PATHS</text>
<rect x="55" y="153" width="470" height="60" rx="10" fill="#eef4fa" stroke="#c9d2dd"/>
<text x="290.0" y="189.0" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2S battery +</text>
