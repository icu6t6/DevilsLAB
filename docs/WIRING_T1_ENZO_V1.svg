<text x="290.0" y="327" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Main Schottky</text>
<text x="290.0" y="350" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Band / cathode toward source rail</text>
<polyline points="290,363 290,378" fill="none" stroke="#365b82" stroke-width="2"/>
<polygon points="290,378 285.21537912477646,368.0950818741206 294.78462087522354,368.0950818741206" fill="#365b82"/>
