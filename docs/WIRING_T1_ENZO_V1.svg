<text x="290.0" y="252" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Inline fuse</text>
<text x="290.0" y="275" fill="#192d43" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Original documentation: approximately 5A</text>
<polyline points="290,288 290,303" fill="none" stroke="#365b82" stroke-width="2"/>
<polygon points="290,303 285.21537912477646,293.0950818741206 294.78462087522354,293.0950818741206" fill="#365b82"/>
